<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giucelio | Padre Eloy Foot News</title>
  <meta name="description" content="Portal fictício e satírico sobre uma liga de Brasfoot entre amigos.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/image-map.js" defer></script>
  <script src="assets/js/data.js" defer></script>
</head>

<body data-coach="giucelio">
  <header data-site-header></header>

  <main>
    <section class="profile-hero">
      <div class="container profile-shell">
        <article class="profile-summary">
          <div class="profile-top">
            <img data-profile-coach-image src="" alt="">
            <div>
              <span class="badge" data-profile-badge></span>
              <h1 style="margin:.7rem 0 .45rem;" data-profile-name></h1>
              <p style="font-size:1.08rem; color:var(--text-soft); margin:0;" data-profile-summary></p>
            </div>
          </div>
          <div class="kpis" data-profile-kpis></div>
        </article>
        <aside class="side-visual">
          <img data-profile-team-image src="" alt="">
        </aside>
      </div>
    </section>

    <section class="section">
      <div class="container article-grid">
        <article class="article-card">
          <span class="badge">Chamada principal</span>
          <h2 class="section-title" data-profile-headline></h2>
          <p data-profile-trajectory></p>
          <div data-profile-narrative></div>
        </article>
        <aside class="article-card">
          <span class="badge">Narrativa oficial da redação</span>
          <h2 class="section-title">Resumo PEFN</h2>
          <p data-profile-additional></p>
          <div class="quote-list" data-profile-quotes></div>
        </aside>
      </div>
    </section>

    <section class="section">
      <div class="container article-grid">
        <article class="article-card">
          <span class="badge">Linha do tempo</span>
          <h2 class="section-title">Resultados por temporada</h2>
          <div data-profile-results></div>
        </article>
        <aside class="article-card">
          <span class="badge">Leia também</span>
          <h2 class="section-title">Matérias relacionadas</h2>
          <div class="related-grid" data-profile-related></div>
        </aside>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
  <script src="assets/js/profile.js" defer></script>
</body>
</html>
